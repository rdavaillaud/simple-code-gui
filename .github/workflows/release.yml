name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "version=$BASE.$(date +%s)" >> $GITHUB_OUTPUT

  build-linux:
    needs: [setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build app
        run: npm run build

      - name: Package for Linux
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-builds
          path: |
            dist-build/*.AppImage
            dist-build/*.deb
            dist-build/*.rpm
            dist-build/*.yml

  build-macos:
    needs: [setup]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package for macOS
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-builds
          path: |
            dist-build/*.dmg
            dist-build/*.zip
            dist-build/*.yml
            dist-build/*.blockmap

  build-windows:
    needs: [setup]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package for Windows
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-builds
          path: |
            dist-build/*.exe
            dist-build/*.appx
            dist-build/*.yml
            dist-build/*.blockmap

  release:
    needs: [setup, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-builds
          path: dist-build

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-builds
          path: dist-build

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-builds
          path: dist-build

      - name: Get version
        id: version
        run: echo "version=v${{ needs.setup.outputs.version }}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: ls -la dist-build/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Simple Claude GUI ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist-build/*.AppImage
            dist-build/*.deb
            dist-build/*.rpm
            dist-build/*.dmg
            dist-build/*.zip
            dist-build/*.exe
            dist-build/*.appx
            dist-build/*.yml
            dist-build/*.blockmap
          body: |
            ## Installation

            ### Windows
            - **Installer**: Download `Simple-Claude-GUI-Setup-*.exe` and run it
            - **Portable**: Download `Simple-Claude-GUI-Portable-*.exe` (no installation required)
            - **Windows Store**: Coming soon! (`.appx` package included for manual sideloading)

            ### macOS
            Download the `.dmg` file, open it, and drag Simple Claude GUI to your Applications folder.
            - `arm64` = Apple Silicon (M1/M2/M3)
            - `x64` = Intel Macs

            ### AppImage (Any Linux distro)
            ```bash
            chmod +x Simple-Claude-GUI-*.AppImage
            ./Simple-Claude-GUI-*.AppImage
            ```

            ### Debian/Ubuntu
            ```bash
            sudo dpkg -i Simple-Claude-GUI-*.deb
            ```

            ### Fedora/RHEL
            ```bash
            sudo rpm -i Simple-Claude-GUI-*.rpm
            ```

            ### Arch Linux (AUR)
            ```bash
            yay -S simple-claude-gui
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
